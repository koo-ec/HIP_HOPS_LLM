name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One Windows and one macOS run: the Graphviz fallback and the
          # importlib.resources data loading are the platform-sensitive parts.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Show environment
        run: |
          python -c "import sys, numpy, pandas, scipy; print(sys.version); print('numpy', numpy.__version__); print('pandas', pandas.__version__)"
          python -c "import pyagrum; print('pyagrum', pyagrum.__version__)"
          python -c "from HIP_HOPS_LLM import graphviz_available; print('graphviz', graphviz_available())"

      - name: Test
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: pytest -q --timeout=900

  no-pyagrum:
    # pyAgrum is documented as optional. This job is what makes that true:
    # every probability must still be computable by exact enumeration.
    name: pytest without pyAgrum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: Confirm pyAgrum really is absent
        run: |
          python - <<'PY'
          try:
              import pyagrum
          except ImportError:
              print("pyagrum absent, as intended")
          else:
              raise SystemExit("pyagrum is installed; this job would prove nothing")
          PY
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q --timeout=900

  examples:
    name: run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run every example script
        env:
          MPLBACKEND: Agg
        run: |
          for script in examples/*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "
          import HIP_HOPS_LLM as H
          from HIP_HOPS_LLM import load_example, load_outcomes, AgenticReliabilityStudy
          print(H.__version__, len(H.__all__), 'exports')
          s = AgenticReliabilityStudy(load_example('parallel_aggregator'))
          s.analyse()
          print(sorted(s.report.trees))
          print('bundled data ships:', len(load_outcomes()), 'rows')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
