name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,bayes]"
      - name: Build
        run: sphinx-build -b html docs/source docs/build/html -W --keep-going
      - name: Check the documented examples still run
        env:
          MPLBACKEND: Agg
        run: |
          python -c "
          from HIP_HOPS_LLM import AgenticReliabilityStudy, load_example, load_outcomes
          study = AgenticReliabilityStudy(load_example('parallel_aggregator'))
          study.observe(load_outcomes(), profile={'short': 0.3, 'medium': 0.5, 'long': 0.2})
          study.run()
          assert 'NOT CALIBRATED' not in study.summary()
          print(study.hazard_probability('H2'))
          "
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
